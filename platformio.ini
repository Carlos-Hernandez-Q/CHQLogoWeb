; CHQ Labs - CHQLogoWeb V1, simulador local (NO LOGO! real todavía)
[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_ldf_mode = chain+
build_src_filter = +<main.cpp>

; Primer PLC físico: ejemplo manual, lecturas por defecto, sin escritura automática.
[env:logo-real]
extends = env:esp32-s3
build_src_filter = +<logo_real.cpp>
