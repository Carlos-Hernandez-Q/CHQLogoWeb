; Ejemplos para ESP32-S3 con adaptador USB-serie.
[platformio]
default_envs = esp32-s3

[env]
platform = espressif32@6.12.0
board = esp32s3usbotg
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
lib_ldf_mode = chain+

[env:esp32-s3]
build_src_filter = +<main.cpp>

[env:analogica]
build_src_filter = +<lectura_analogica.cpp>

[env:ultrasonico]
build_src_filter = +<ultrasonico_simulado.cpp>
